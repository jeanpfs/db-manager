name: Feature request
description: Suggest an improvement
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the skill makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What change to SKILL.md, security-rules.md, or install.sh would solve it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they don't fit.
  - type: textarea
    id: threat-model
    attributes:
      label: Impact on the threat model
      description: Does this change what the skill protects against, or what it persists? If unsure, leave blank.
